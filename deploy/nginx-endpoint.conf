# /etc/nginx/sites-available/endpoint.esta.co.id
# Nginx Configuration for Endpoint Management Enterprise Platform
# Supports REST API, Embedded Web Console SPA, and Persistent WebSocket Connections

upstream endpoint_backend {
    server 127.0.0.1:8443;
    keepalive 64;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name endpoint.esta.co.id;

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS & WSS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name endpoint.esta.co.id;

    # Wildcard Certificate *.esta.co.id
    ssl_certificate     /etc/ssl/esta/esta.co.id.fullchain.crt;
    ssl_certificate_key /etc/ssl/esta/esta.co.id.key;

    # SSL Security & Hardening (TLS 1.2 & TLS 1.3 only)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Allow large package uploads (Software Deployment & Agent Releases)
    client_max_body_size 1024M;
    client_body_buffer_size 128k;

    # Standard REST API and Web Console SPA
    location / {
        proxy_pass http://endpoint_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Persistent WebSocket Channels:
    # 1. /api/agent/connect                    (Persistent Branch Agent Outbound WebSocket)
    # 2. /api/devices/{id}/terminal/ws         (Interactive Remote Shell)
    # 3. /api/devices/{id}/remotecontrol/ws    (Remote Desktop Screen Relay)
    location ~* ^/api/(agent/connect|devices/.*/(terminal|remotecontrol)/ws) {
        proxy_pass http://endpoint_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering and set 24h timeouts for uninterrupted persistent agent sockets
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
