name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint-test:
    name: Go lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.0
          args: --timeout=5m

      - name: Go build
        run: CGO_ENABLED=0 go build ./...

      - name: Go vet
        run: CGO_ENABLED=0 go vet ./...

      - name: Go test
        run: CGO_ENABLED=0 go test -count=1 ./...

  cross-compile:
    name: Cross-compile agents
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build agent
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -o agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./agent/cmd/agent
      - name: Build server (linux amd64 only)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -o endpoint-mgmt-server-linux-amd64 ./server/cmd/server

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-console
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-console/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify embed sync
        run: |
          if [ ! -d "../server/cmd/server/dist" ]; then
            echo "::error::server/cmd/server/dist missing after frontend build"
            exit 1
          fi

  docker-smoke:
    name: Docker smoke test
    runs-on: ubuntu-latest
    needs: [lint-test, cross-compile, frontend]
    if: always() && github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Build server image
        run: |
          docker build -t endpoint-mgmt-test -f Dockerfile.server .

      - name: Start server
        run: |
          docker run -d --name em-server \
            -p 8443:8443 \
            -e HTTP_ADDR=0.0.0.0:8443 \
            -e DB_PATH=/data/endpoint-mgmt.db \
            -e JWT_SECRET=$(openssl rand -hex 32) \
            -e ADMIN_PASSWORD=test12345 \
            -v $(pwd)/testdata:/data \
            endpoint-mgmt-test

      - name: Wait for health
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8443/healthz >/dev/null; then
              echo "healthy"
              exit 0
            fi
            sleep 1
          done
          echo "server did not become healthy"
          docker logs em-server
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f em-server || true